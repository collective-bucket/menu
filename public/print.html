<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Menü QR Yazdır | Collective Bucket</title>
  <meta
    name="description"
    content="Collective Bucket menüleri için yazdırılabilir QR çıktı şablonu."
  />
  <link rel="icon" href="assets/collective-bucket-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="print.css?v=msyger8v" />
</head>
<body>
  <main class="print-shell">
    <section class="print-toolbar">
      <div>
        <p class="eyebrow">Collective Bucket</p>
        <h1>Menü QR Yazdır</h1>
        <p class="lead">
          Her işletme ayrı sayfada hazırlanır. PDF almak için tarayıcı yazdır menüsünü açın.
        </p>
      </div>
      <div class="toolbar-actions">
        <button class="btn btn-primary" type="button" onclick="window.print()">Yazdır / PDF Al</button>
        <a class="btn btn-ghost" href="/">Menülere dön</a>
      </div>
    </section>

    <section id="print-list" class="print-list" aria-live="polite">
      <article class="print-state">
        <p>QR şablonları hazırlanıyor…</p>
      </article>
    </section>
  </main>

  <template id="print-card-template">
    <article class="print-page">
      <div class="print-frame">
        <div class="qr-stage">
          <img class="qr-image" alt="" />
        </div>
        <div class="print-caption">
          <span class="caption-left"></span>
          <span class="caption-right">
            <img src="/assets/collective-bucket-logo.png?v=msyger8v" alt="" />
            <span>Collective Bucket</span>
          </span>
        </div>
      </div>
    </article>
  </template>

  <script src="print.js?v=msyger8v"></script>
</body>
</html>
