<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Collective Bucket | Menüler</title>
  <meta name="description" content="Collective Bucket bünyesindeki işletmelerin QR ile açılan dijital menülerine buradan ulaşabilirsiniz." />
  <link rel="icon" href="assets/collective-bucket-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="site-header">
    <img class="site-logo" src="assets/collective-bucket-logo.png" alt="Collective Bucket logosu" />
    <h1>Collective Bucket — Menüler</h1>
    <p class="tagline">
      Aşağıdaki işletmelerden birini seçerek menüsünü görüntüleyebilir ya da
      kendi QR kodunu telefon kameranızla okutabilirsiniz.
    </p>
  </header>

  <main id="business-list" class="business-list">
    <p class="loading">İşletmeler yükleniyor...</p>
  </main>

  <footer class="site-footer">
    <p>Bu bir demo sayfasıdır.</p>
    <div class="site-footer-links">
      <a href="https://collectivebucket.com" target="_blank" rel="noopener">
        <img src="assets/collective-bucket-logo.png" alt="" />
        <span>collectivebucket.com</span>
      </a>
    </div>
  </footer>

  <script src="hub.js"></script>
</body>
</html>
