name: Deploy preview on PR

on: pull_request

permissions:
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run generate-print-pdfs
      - name: Deploy preview channel
        id: deploy
        run: |
          npx firebase-tools hosting:channel:deploy "pr-${{ github.event.number }}" \
            --only hosting:menu \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --non-interactive \
            | tee deploy-output.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.web\.app[^ ]*' deploy-output.txt | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.number }}" --body "🔗 Preview: ${{ steps.deploy.outputs.url }}"
